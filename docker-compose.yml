services:
  # --- AWS simulado: S3 (archivos) y SQS (cola de cargas) ---
  localstack:
    container_name: localstack_drive
    image: localstack/localstack
    ports:
      - '127.0.0.1:4566:4566' # LocalStack Gateway
      - '127.0.0.1:4510-4559:4510-4559' # external services port range
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?Falta LOCALSTACK_AUTH_TOKEN en el archivo .env}
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-1}
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
    healthcheck:
      # La imagen no trae curl: se consulta /_localstack/health con bash puro
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/4566 && printf "GET /_localstack/health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q 200']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # --- Crea el bucket y las colas con Terraform y termina ---
  terraform:
    container_name: terraform_drive
    image: hashicorp/terraform:latest
    working_dir: /infra
    volumes:
      - './terraform:/infra'
    environment:
      - TF_VAR_localstack_endpoint=http://localstack:4566
    entrypoint: ['sh', '-c', 'terraform init -input=false && terraform apply -auto-approve -input=false']
    depends_on:
      localstack:
        condition: service_healthy

  # --- Metadatos: usuarios, carpetas, archivos y permisos ---
  postgres:
    container_name: postgres_drive
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=drive
      - POSTGRES_PASSWORD=drive
      - POSTGRES_DB=drive
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drive -d drive']
      interval: 5s
      timeout: 3s
      retries: 20

  # --- API NestJS ---
  backend:
    container_name: backend_drive
    build: ./backend
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://drive:drive@postgres:5432/drive
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=drive-clon-storage
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/drive-upload-queue
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
