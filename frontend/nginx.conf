server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api/* -> backend. Lo usa "arrastrar un archivo al escritorio": Chrome solo
  # permite esa descarga si la URL es del mismo origen que la página.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_buffering off;
    client_max_body_size 0;
  }
}
